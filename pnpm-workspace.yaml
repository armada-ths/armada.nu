packages:
  - apps/*
  - packages/*

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  core-js: true
  sharp: true
  unrs-resolver: true
  esbuild: true

overrides:
  path-to-regexp@>=4.0.0 <6.3.0: ">=6.3.0"

  # Newer native carriers reject Windows cache ACLs: swc-project/swc#12442.
  "@swc/core": "1.15.33"
